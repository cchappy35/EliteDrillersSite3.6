<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
:root{--brown:#5c4738;--paper2:#e4dfd6;--muted:#8a8175;--line:#e4dfd6;--ink:#141414;--linedk:#3a3a3a;--card:#ffffff;}
</style>
</helmet>
<div style="{{ box }}">
  <sc-if value="{{ hasSrc }}" hint-placeholder-val="{{ false }}">
    <img src="{{ src }}" alt="{{ caption }}" style="{{ img }}" />
  </sc-if>
  <sc-if value="{{ noSrc }}" hint-placeholder-val="{{ true }}">
    <span style="{{ tick }}; top:8px; left:8px; border-top:2px solid var(--brown); border-left:2px solid var(--brown);"></span>
    <span style="{{ tick }}; top:8px; right:8px; border-top:2px solid var(--brown); border-right:2px solid var(--brown);"></span>
    <span style="{{ tick }}; bottom:8px; left:8px; border-bottom:2px solid var(--brown); border-left:2px solid var(--brown);"></span>
    <span style="{{ tick }}; bottom:8px; right:8px; border-bottom:2px solid var(--brown); border-right:2px solid var(--brown);"></span>
    <span style="{{ cap }}">{{ caption }}</span>
    <span style="{{ dimTag }}">{{ dim }}</span>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:320},&quot;src&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;focus&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;center&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;caption&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;PHOTO · RIG IN ACTION&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dim&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;FIG 01 / 4:5&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;aspect&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;4 / 3&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark === true || this.props.dark === "true";
    const aspect = this.props.aspect || "4 / 3";
    const src = this.props.src || "";
    const fg = dark ? "rgba(255,255,255,.55)" : "var(--muted)";
    const hatch = dark
      ? "repeating-linear-gradient(45deg, transparent, transparent 7px, rgba(255,255,255,.06) 7px, rgba(255,255,255,.06) 8px)"
      : "repeating-linear-gradient(45deg, transparent, transparent 7px, rgba(92,71,56,.10) 7px, rgba(92,71,56,.10) 8px)";
    return {
      caption: this.props.caption || "PHOTO",
      dim: this.props.dim || "FIG / 4:3",
      src, hasSrc: !!src, noSrc: !src,
      box: {
        position: "relative", width: "100%", aspectRatio: aspect, overflow: "hidden",
        display: "flex", alignItems: "center", justifyContent: "center",
        backgroundColor: src ? (dark ? "#1e1e1e" : "var(--paper2)") : (dark ? "#1e1e1e" : "var(--paper2)"),
        backgroundImage: src ? "none" : hatch,
        border: dark ? "1px solid var(--linedk)" : "1px solid var(--line)",
      },
      img: {
        position: "absolute", inset: 0, width: "100%", height: "100%",
        objectFit: "cover", objectPosition: this.props.focus || "center", display: "block",
      },
      tick: "position:absolute; width:14px; height:14px;",
      cap: {
        fontFamily: "'Spline Sans Mono', monospace", fontSize: "12px",
        letterSpacing: ".15em", textTransform: "uppercase", color: fg,
        textAlign: "center", padding: "0 16px",
      },
      dimTag: {
        position: "absolute", bottom: "10px", right: "12px",
        fontFamily: "'Spline Sans Mono', monospace", fontSize: "10px",
        letterSpacing: ".12em", textTransform: "uppercase", color: fg,
      },
    };
  }
}
</script>
</body>
</html>
